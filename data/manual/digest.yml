    items:
      - tag: ARR
        text: Anthropic 招股书修订稿（S-1/A No.2，11-10 提交）首次给出一手口径：截至 10-31 年化运行率约 810 亿美元，较 9-30 增加 100 亿；Q3 单季收入 169.6 亿，前九个月 332 亿。本站锚点由 7-31 的 650 亿更新到 10-31 的 810 亿。
        source_url: https://www.sec.gov/Archives/edgar/data/2130357/000162828026072484/anthropicpbc-sx1ax2.htm
      - tag: ARR
        text: OpenAI 向投资者披露 9 月底年化收入约 500 亿美元（7 月底为 400 亿以上）；同期 Axios 报的约 700 亿是加回合作伙伴毛收入的另一口径，两者不能相加也不能当作增长。
        source_url: https://www.cnbc.com/2026/10/08/open-ai-revenue-nvidia-oracle-coreweave.html
      - tag: ARR
        text: 估算方法修正：外推改为从最近披露值出发。此前按全历史曲线外推，Anthropic 今日估算一度到 1542 亿；更新锚点并校准后为约 934 亿（最近披露 810 亿之后 22 天）。
        source_url: "#p-arr_anchors"
      - tag: Quote
        text: Alphabet Q3 财报：自家模型 API 每分钟处理近 320 亿 token，比上季多 40%，是一年前的四倍多。
        source_url: https://blog.google/company-news/inside-google/message-ceo/alphabet-earnings-q3-2026/
      - tag: GPU
        text: 租价面板由 5 个卡型扩到 16 个（新增 B300、H200 NVL、H100 PCIe、L40S、L4、RTX PRO 6000、RTX 6000 Ada、RTX A6000、RTX 4090、RTX 5080、RTX 3090）。首日读数：B300 中位 $10.10/小时，比 B200（$8.13）贵约 24%。
        source_url: "#p-gpu_table"

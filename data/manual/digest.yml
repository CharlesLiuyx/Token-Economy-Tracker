digest:
  - date: 2026-11-25
    items:
      - tag: Model
        text:
          zh: Google Gemini API 定价页已列出 Gemini 4 Neon：每百万 token 输入 3 美元、输出 15 美元（含思考 token）、缓存 0.15；Batch 半价 1.50 / 7.50；不提供免费额度。
          en: "Google's Gemini API pricing page now lists Gemini 4 Neon at $3 input and $15 output (thinking tokens included) per million tokens, with cached input at $0.15; Batch is half price at $1.50 / $7.50, and there is no free tier."
        source_url: https://aistudio.google.com/docs/pricing
      - tag: Model
        text:
          zh: 同一定价页显示，Gemini 4 Carbon 与 Argon 的首发价 11-30 到期，12-01 起翻倍：输入 2→4 美元、输出 10→20 美元、缓存 0.10→0.20。Carbon 是 OpenRouter 上用量最大的 Google 模型（11-23 滚动 7 天 2.27 万亿 token）。
          en: "The same pricing page shows Gemini 4 Carbon and Argon introductory rates expire on Nov 30 and double from Dec 1: input $2 to $4, output $10 to $20, cached input $0.10 to $0.20. Carbon is the most-used Google model on OpenRouter (2.27T tokens over the rolling 7 days to Nov 23)."
        source_url: https://aistudio.google.com/docs/pricing
      - tag: Token
        text:
          zh: OpenRouter 上 GPT-6.2 Sol 滚动 7 天用量 11-23 为 8980 亿 token（11-21 为 5780 亿），仍不到上一代 GPT-6.1 Sol（2.39 万亿）的四成；Gemini 4 Neon 同期从 3920 亿升到 6960 亿。两者都未反超旧款，重点模型名单不换代。
          en: "On OpenRouter, GPT-6.2 Sol's rolling 7-day usage reached 898B tokens on Nov 23 (578B on Nov 21), still under 40% of the previous GPT-6.1 Sol (2.39T); Gemini 4 Neon rose from 392B to 696B over the same span. Neither has overtaken its predecessor, so the tracked-model list is unchanged."
        source_url: "#p-or_tracked"
      - tag: Token
        text:
          zh: OpenRouter 全平台周用量 11-24 为 220.7 万亿 token，比 7 天前多 3.2%，比 30 天前多 23%。
          en: "OpenRouter's platform-wide weekly usage was 220.7T tokens on Nov 24, up 3.2% from seven days earlier and 23% from 30 days earlier."
        source_url: "#p-or_weekly_total"
  - date: 2026-11-24
    items:
      - tag: GPU
        text:
          zh: NVIDIA 11-17 发布 2027 财年 Q3（截至 10-25）财报：收入 1158 亿美元，同比 +103%、环比 +20%；数据中心收入 1076 亿，同比 +110%、环比 +21%。Q4 指引 1300 亿 ±3%（该季多一周），不计任何来自中国的数据中心算力收入。
          en: "NVIDIA reported fiscal 2027 Q3 (ended Oct 25) on Nov 17: revenue $115.8B, up 103% year over year and 20% quarter over quarter; Data Center revenue $107.6B, up 110% YoY and 21% QoQ. Q4 guidance is $130.0B plus or minus 3% (the quarter has an extra week), assuming no Data Center compute revenue from China."
        source_url: https://investor.nvidia.com/news/press-release-details/2026/NVIDIA-Announces-Financial-Results-for-Third-Quarter-Fiscal-2027/default.aspx
      - tag: ARR
        text:
          zh: Anthropic 11-19 在纳斯达克上市（ANT）：开盘 111.50 美元，比 83 美元发行价高 34%；收盘 97.17 美元，较发行价 +17%，按完全稀释口径市值约 1.8 万亿美元。同日纳斯达克综合指数跌超 2%。
          en: "Anthropic began trading on Nasdaq (ANT) on Nov 19: it opened at $111.50, 34% above the $83 offer price, and closed at $97.17, up 17%, for a fully diluted market cap of about $1.8T. The Nasdaq Composite fell more than 2% the same day."
        source_url: https://www.cnbc.com/2026/11/19/anthropic-ipo-ant-live-updates.html
      - tag: Model
        text:
          zh: OpenAI 推出 GPT-6.2 Astra 与 Sol。Astra API 定价每百万 token 输入 8 美元、缓存输入 0.40、输出 40；Sol 维持 2 / 0.10 / 10。截至 11-23 两者尚未进入 OpenRouter 周榜，本站重点模型名单暂不换代。
          en: "OpenAI launched GPT-6.2 Astra and Sol. Astra's API price is $8 input, $0.40 cached input and $40 output per million tokens; Sol stays at $2 / $0.10 / $10. As of Nov 23 neither appears in OpenRouter's weekly ranking, so this site's tracked-model list is unchanged."
        source_url: https://openai.com/index/introducing-gpt-6-2-astra-sol
      - tag: Token
        text:
          zh: Vercel AI Gateway 11-22 单日 token 份额：DeepSeek V4.1 Flash 升到 30.0%（11-15 为 17.6%），超过 Beam 1.0（16.1%，11-15 为 26.4%）成为第一。
          en: "On Vercel AI Gateway, DeepSeek V4.1 Flash took 30.0% of daily tokens on Nov 22 (17.6% on Nov 15), passing Beam 1.0 (16.1%, down from 26.4%) for first place."
        source_url: "#p-vercel_tokens"
  - date: 2026-11-23
    items:
      - tag: ARR
        text:
          zh: Anthropic 11-19 提交终版招股书（424B4）：IPO 定价每股 83 美元，发行 9.8 亿股 A 类股（公司新发 9.56 亿、老股东 0.24 亿），按发行价约 813 亿美元；另有 Google、NVIDIA 等按同价认购 260 亿美元定向增发。纳斯达克代码 ANT。终版仍沿用 10-31 约 810 亿的运行率，没有新数字。
          en: "Anthropic filed its final prospectus (424B4) on Nov 19: the IPO priced at $83 per share for 980M Class A shares (956M new, 24M from selling holders), about $81.3B at the offer price, plus a $26.0B concurrent private placement at the same price from Google, NVIDIA and others. Nasdaq ticker ANT. The final filing keeps the ~$81B run-rate as of Oct 31; no new figure."
        source_url: https://www.sec.gov/Archives/edgar/data/2130357/000162828026074944/anthropicpbc-424b4.htm
      - tag: ARR
        text:
          zh: 据 Bloomberg 援引知情人士，OpenAI Q3 收入首次超过 100 亿美元，比 Q2 的约 67 亿多近 50%；调整后营业利润率从 Q2 的 −150% 收窄到 −109%。同文称运行率 500 亿，但未给时点，本站不更新锚点。
          en: "Citing people familiar, Bloomberg reports OpenAI's Q3 revenue topped $10B for the first time, up almost 50% from about $6.7B in Q2; adjusted operating margin narrowed from -150% to -109%. The same report puts the run-rate at $50B without an as-of date, so this site's anchor is unchanged."
        source_url: https://techcrunch.com/2026/11/11/openais-quarterly-revenue-reportedly-crosses-10b-for-the-first-time/
      - tag: Token
        text:
          zh: OpenRouter 上 gemini-4-carbon 滚动 7 天用量 2.43 万亿 token，是 7 天前（6630 亿）的 3.7 倍，超过 gemini-3.8-flash（1.65 万亿），成为该平台用量最大的 Google 模型；同代 gemini-4-argon 同期从 9170 亿降到 6880 亿。
          en: "On OpenRouter, gemini-4-carbon's rolling 7-day usage reached 2.43T tokens, 3.7x the 663B of seven days earlier, overtaking gemini-3.8-flash (1.65T) as the platform's most-used Google model; sibling gemini-4-argon fell from 917B to 688B over the same week."
        source_url: "#p-or_tracked"
      - tag: DC
        text:
          zh: TensorWave 与 OpenAI 签下 6 年 457 MW 专属算力协议，基于 AMD Helios 机架，分布在美国多个站点，2027 年初开始上线、2028 年初全部部署；是 OpenAI–AMD 6 GW 协议中首家公开的新云供应商。
          en: "TensorWave signed a six-year deal to provide OpenAI with 457 MW of dedicated capacity on AMD Helios racks across multiple US sites, coming online from early 2027 with full deployment by early 2028 - the first neocloud publicly named under the OpenAI-AMD 6 GW agreement."
        source_url: https://w.media/tensorwave-signs-457-mw-deal-to-support-openais-amd-buildout/
  - date: 2026-11-22
    items:
      - tag: ARR
        text:
          zh: Anthropic 招股书修订稿（S-1/A No.2，11-10 提交）首次给出一手口径：截至 10-31 年化运行率约 810 亿美元，较 9-30 增加 100 亿；Q3 单季收入 169.6 亿，前九个月 332 亿。本站锚点由 7-31 的 650 亿更新到 10-31 的 810 亿。
          en: "Anthropic's amended prospectus (S-1/A No.2, filed Nov 10) gives the first primary-source figure: run-rate revenue of about $81B as of Oct 31, up $10B from Sep 30; Q3 revenue $16.96B, nine-month revenue $33.2B. This site's anchor moves from $65B (Jul 31) to $81B (Oct 31)."
        source_url: https://www.sec.gov/Archives/edgar/data/2130357/000162828026072484/anthropicpbc-sx1ax2.htm
      - tag: ARR
        text:
          zh: OpenAI 向投资者披露 9 月底年化收入约 500 亿美元（7 月底为 400 亿以上）；同期 Axios 报的约 700 亿是加回合作伙伴毛收入的另一口径，两者不能相加也不能当作增长。
          en: "OpenAI told investors its annualized revenue was about $50B at the end of September (above $40B at end-July). The roughly $70B Axios reported at the same time adds back partner gross revenue - a different basis, neither additive nor evidence of growth."
        source_url: https://www.cnbc.com/2026/10/08/open-ai-revenue-nvidia-oracle-coreweave.html
      - tag: ARR
        text:
          zh: 估算方法修正：外推改为从最近披露值出发。此前按全历史曲线外推，Anthropic 今日估算一度到 1542 亿；更新锚点并校准后为约 934 亿（最近披露 810 亿之后 22 天）。
          en: "Method fix: extrapolation now starts from the latest disclosed value. Extrapolating along the full-history curve had pushed Anthropic's estimate to $154.2B; with new anchors and level calibration it is about $93.4B (22 days after the $81B disclosure)."
        source_url: "#p-arr_anchors"
      - tag: Quote
        text:
          zh: Alphabet Q3 财报：自家模型 API 每分钟处理近 320 亿 token，比上季多 40%，是一年前的四倍多。
          en: "Alphabet Q3 earnings: its first-party model APIs now process nearly 32 billion tokens per minute, 40% more than last quarter and over four times a year ago."
        source_url: https://blog.google/company-news/inside-google/message-ceo/alphabet-earnings-q3-2026/
      - tag: GPU
        text:
          zh: 租价面板由 5 个卡型扩到 16 个（新增 B300、H200 NVL、H100 PCIe、L40S、L4、RTX PRO 6000、RTX 6000 Ada、RTX A6000、RTX 4090、RTX 5080、RTX 3090）。首日读数：B300 中位 $10.10/小时，比 B200（$8.13）贵约 24%。
          en: "The rental panel grows from 5 GPU models to 16 (adding B300, H200 NVL, H100 PCIe, L40S, L4, RTX PRO 6000, RTX 6000 Ada, RTX A6000, RTX 4090, RTX 5080, RTX 3090). First-day reading: B300 median $10.10/hr, about 24% above B200 ($8.13)."
        source_url: "#p-gpu_table"

# ★ 源注册表（单一事实来源）：fetcher、文档、状态页都从这里读元数据。
# 新增源必须齐三件套：本文件条目 + docs/sources/<source>.md + docs/sources/samples/。
# kind: official-api | official-download | unofficial-api | scrape | manual

epoch_datacenters:
  fetcher: scripts/fetch/epoch_datacenters.py
  doc: docs/sources/epoch_datacenters.md
  schedule: daily          # 源头约每周更新，每日拉取无害
  kind: official-download
  refetch_window_days: 3
  license: CC-BY (Epoch AI, Frontier Data Centers dataset)
  endpoints:
    data_centers_csv: https://epoch.ai/data/data_centers/data_centers.csv
    timelines_csv: https://epoch.ai/data/data_centers/data_center_timelines.csv

sdk_downloads:
  fetcher: scripts/fetch/sdk_downloads.py
  doc: docs/sources/sdk_downloads.md
  schedule: daily
  kind: official-api
  refetch_window_days: 3
  # npm 走 downloads/range 通路（命名周期 point/last-* 自 2026-10-27 指针错乱，见 docs）
  npm_packages: ["openai", "@anthropic-ai/sdk", "@google/genai"]
  pypi_packages: ["openai", "anthropic", "google-genai"]

news:
  fetcher: scripts/fetch/news.py
  doc: docs/sources/news.md
  schedule: daily
  kind: unofficial-api      # Google News RSS，无承诺但多年稳定
  refetch_window_days: 3
  queries:
    - '"AI data center" (gigawatt OR megawatt OR construction OR power)'
    - '"data center" (OpenAI OR Anthropic OR xAI OR Nvidia OR Microsoft OR Meta)'
  domain_whitelist:
    - reuters.com
    - bloomberg.com
    - wsj.com
    - ft.com
    - cnbc.com
    - theinformation.com
    - semianalysis.com
    - datacenterdynamics.com
    - datacenterfrontier.com
    - techcrunch.com
    - theverge.com
    - theregister.com
    - tomshardware.com
    - businessinsider.com
    - washingtonpost.com
    - nytimes.com

manual:
  fetcher: null              # git 即编辑界面；每日更新任务维护（docs/daily-routine.md）
  doc: docs/daily-routine.md
  schedule: ad-hoc
  kind: manual
  files:
    - data/manual/arr_anchors.yml
    - data/manual/quotes.yml
    - data/manual/digest.yml

openrouter:
  fetcher: scripts/fetch/openrouter.py
  doc: docs/sources/openrouter.md
  schedule: daily
  kind: unofficial-api      # frontend API 无公开承诺，见 ADR-002
  refetch_window_days: 3
  endpoints:
    base: https://openrouter.ai/api/frontend/v1/rankings
    datasets: [model-rankings-chart, models, apps]
  # 面板 2b 重点模型对比（permaslug，slug 变更时同步更新面板配置）。
  # 颜色跟厂商走（build.py VENDORS），同厂商多条线靠线型区分；前 5 个进「变化雷达」。
  # 历史快照含全部模型，换 slug 后序列自动从该模型上线日起回溯，无需回补。
  # 换代记录见 docs/sources/openrouter.md「重点模型名单」（最近一次 2026-11-22）。
  models_tracked:
    - anthropic/claude-opus-5.5-20260921
    - openai/gpt-6-luna-20260922
    - anthropic/claude-sonnet-5.5-20260928
    - anthropic/claude-fable-5.2-20261109
    - google/gemini-4-carbon-20261110
    - openai/gpt-6.1-sol-20260929
    - deepseek/deepseek-v4.1-flash-20261017
    - x-ai/grok-4.7-20260916
    - moonshotai/kimi-k3.1-pro-20261023
    - z-ai/glm-5.3-flash-20260826

vercel_gateway:
  fetcher: scripts/fetch/vercel_gateway.py
  doc: docs/sources/vercel_gateway.md
  schedule: daily
  kind: scrape              # 解析页面 RSC flight 载荷，见 ADR-003
  refetch_window_days: 3
  page: https://vercel.com/ai-gateway/leaderboards
  note: 数据是份额百分比（非绝对量）；页面内嵌 ~61 天历史

gpu_prices:
  fetcher: scripts/fetch/gpu_prices.py
  doc: docs/sources/gpu_prices.md
  schedule: daily
  kind: official-api        # Vast.ai 公开市场 API，免鉴权，见 ADR-004
  refetch_window_days: 3
  api: https://console.vast.ai/api/v0/bundles/
  # 面板标签 -> {name: Vast.ai gpu_name 精确枚举, vram_gb, tier}。顺序即表格与配色序。
  # 既有 5 个标签（H100/H200/B200/A100/RTX 5090）不可改名——历史快照按标签累积。
  # tier: frontier（旗舰训练卡）/ datacenter（上代与推理卡）/ workstation / consumer。
  # 2026-11-22 由 5 扩到 16 卡型；新卡型序列自该日起累积（探测结果见 docs/sources/gpu_prices.md）。
  gpus:
    B300:            {name: B300,           vram_gb: 270, tier: frontier}
    B200:            {name: B200,           vram_gb: 180, tier: frontier}
    H200:            {name: H200,           vram_gb: 141, tier: frontier}
    H200 NVL:        {name: H200 NVL,       vram_gb: 141, tier: frontier}
    H100:            {name: H100 SXM,       vram_gb: 80,  tier: frontier}
    H100 PCIe:       {name: H100 PCIE,      vram_gb: 80,  tier: frontier}
    A100:            {name: A100 SXM4,      vram_gb: 80,  tier: datacenter}
    L40S:            {name: L40S,           vram_gb: 48,  tier: datacenter}
    L4:              {name: L4,             vram_gb: 24,  tier: datacenter}
    RTX PRO 6000:    {name: RTX PRO 6000 S, vram_gb: 96,  tier: workstation}
    RTX 6000 Ada:    {name: RTX 6000Ada,    vram_gb: 48,  tier: workstation}
    RTX A6000:       {name: RTX A6000,      vram_gb: 48,  tier: workstation}
    RTX 5090:        {name: RTX 5090,       vram_gb: 32,  tier: consumer}
    RTX 4090:        {name: RTX 4090,       vram_gb: 24,  tier: consumer}
    RTX 5080:        {name: RTX 5080,       vram_gb: 16,  tier: consumer}
    RTX 3090:        {name: RTX 3090,       vram_gb: 24,  tier: consumer}

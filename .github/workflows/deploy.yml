# push 到 main 时立即重建并部署 Pages（不抓数、不提交，避免与 daily.yml 的 bot push 打成循环）
name: deploy-on-push

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/**"
      - "data/**"
      - "reports/**"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# 与 daily.yml 的 Pages 部署共用一把锁，避免两个 workflow 同时 deploy 冲突
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  # 上传和部署分成两个 job：同一 job 里 deploy-pages 紧跟上传去查 artifact，
  # 常查不到刚传的包（"Found 0 artifact(s)"）；换 job 要重新分配 runner，中间隔几秒就查得到了。
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt

      - name: Build site (rebuild from committed data, no fetch)
        run: make build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deploy

panel.arr.model_title:
  zh: "曲线形态不是预设的：linear / exponential / log_quadratic 三种候选各自拟合，用滚动起点回测（用前 i 个锚点预测第 i+1 个）挑预测最准的那个"
  en: "The curve shape is not assumed: linear / exponential / log_quadratic are each fitted, then picked by walk-forward backtest (fit on the first i anchors, predict the next one)"
panel.arr_chart.title:
  zh: ARR 轨迹：披露锚点（实心圆）· 拟合（实线）· 外推（虚线）· 置信带 · 实际年收入（空心菱形）· 第三方估算（空心三角，不入拟合）
  en: "ARR trajectory: disclosed anchors (solid dots) · fit (solid) · extrapolation (dashed) · confidence band · reported annual revenue (hollow diamonds) · third-party estimates (hollow triangles, not fitted)"
panel.arr_chart.note:
  zh: 对数轴。拟合只用公司披露的 run-rate 口径锚点（log 空间加权最小二乘，近期权重高），第三方面板估算只画不拟合；曲线形态在 linear / exponential / log_quadratic 中由滚动起点回测选出。虚线为外推区，沿用最后锚点处的瞬时增速直线延伸（曲率不外推），置信带随外推距离张开，仅供参考。
  en: "Log scale. Fit uses company-disclosed run-rate anchors only (weighted least squares in log space, recency-weighted); third-party panel estimates are plotted but never fitted; the curve shape is chosen among linear / exponential / log_quadratic by walk-forward backtest. The dashed segment extrapolates at the growth rate observed at the last anchor (curvature is not extrapolated), with the band widening by horizon — indicative only."


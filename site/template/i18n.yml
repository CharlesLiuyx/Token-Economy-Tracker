panel.news.note:
  zh: NEW＝标题未出现在上一份快照里（今日新增）。左侧竖条＝标题命中 Anthropic / OpenAI / xAI / NVIDIA / GW 等关键词。
  en: "NEW = headline absent from the previous snapshot (new today). Left bar = headline matches Anthropic / OpenAI / xAI / NVIDIA / GW keywords."
meth.delta:
  zh: <b>变化量</b>：页面上所有「较 N 天前」都由本站每日快照现算（取该日或之前 3 天内最近一份快照），源头不提供历史时无法回溯到开始跟踪之前。
  en: "<b>Deltas</b>: every 'vs N days ago' figure is computed from this site's own daily snapshots (the nearest snapshot on or within 3 days before that date); where the source offers no history, nothing predates the start of tracking."
meth.manual_sources:
  zh: 人工维护：ARR 披露锚点（<code>data/manual/arr_anchors.yml</code>，逐条带来源链接，见「最近披露一览」）、专家观点与每日速读（每条带一手来源）。
  en: "Hand-curated: ARR disclosure anchors (<code>data/manual/arr_anchors.yml</code>, each with a source link — see the disclosures table), expert quotes and the daily digest (each with a primary source)."
panel.digest.source:

# ---- ① ARR 补充 ----
panel.arr.age:
  zh: "距最近披露 {days} 天"
  en: "{days}d since last disclosure"
panel.arr.age_tip:
  zh: 大数字是从最近一次披露按拟合增速外推出来的。距披露 ≤45 天正常，46–90 天提示，超过 90 天标红：此时数字基本是纯外推，误差随天数复利放大。
  en: The big number is extrapolated from the latest disclosure at the fitted growth rate. ≤45 days is normal, 46–90 is a caution, beyond 90 is flagged red — by then the figure is nearly pure extrapolation and the error compounds daily.
panel.arr.multiple_tip:
  zh: 当前估算值 ÷ 最近一次披露值。倍数越大，说明估算里「外推出来的部分」越多。
  en: Current estimate ÷ latest disclosed value. The larger the multiple, the more of the estimate is extrapolated rather than disclosed.
panel.arr.range:
  zh: 今日 95% 预测区间
  en: Today's 95% prediction interval
panel.arr.conf_tip:
  zh: 估算可信度：最近披露距今 ≤45 天为〔中〕，更久为〔低〕。披露值本身的可信度见下方锚点表。
  en: "Estimate confidence: [mid] if the latest disclosure is ≤45 days old, [low] otherwise. Confidence of the disclosed values themselves is in the anchor table below."
panel.anchors.title:
  zh: 最近披露一览 — 估算的地基（新→旧）
  en: Latest disclosures — the estimate's foundation (newest first)
panel.anchors.note:
  zh: 只有「年化运行率」口径进入拟合；第三方估算、年度预测、期间实际收入只展示不拟合。可信度：〔高〕公司一手文件或公告，〔中〕可靠媒体引述知情人士，〔低〕第三方面板估算。
  en: "Only run-rate anchors enter the fit; third-party estimates, full-year forecasts and reported period revenue are shown but never fitted. Confidence: [high] company filing or announcement, [mid] reputable press citing people familiar, [low] third-party panel estimate."

# ---- ③ GPU 表 ----
panel.gpu_table.title:
  zh: 16 卡型当日报价 ($/GPU-hr) — Vast.ai on-demand
  en: Today's asks for 16 GPU models ($/GPU-hr) — Vast.ai on-demand
panel.gpu_table.note:
  zh: 区间条：细线＝最低到最高报价，灰盒＝p25–p75，竖线＝中位数。$/GB·hr＝中位价÷显存，便于跨卡型比较「每 GB 显存的租价」。每卡型最多取 64 条报价（API 上限）。点表头排序。
  en: "Range bar: thin line = min to max ask, grey box = p25–p75, tick = median. $/GB·hr = median ÷ VRAM, for comparing rental price per GB of memory across models. At most 64 asks per model (API cap). Click a header to sort."
